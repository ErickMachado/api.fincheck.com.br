name: 'Continuous Integration'

on:
  pull_request:
    branches:
      - 'main'
      - 'feature/**'

jobs:
  lint_commit:
    name: 'Lint Commit'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v7'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v7'
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - name: 'Install Dependencies'
        run: 'npm ci'
      - name: 'Check Commit Messages'
        run: 'npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose'
  audit_dependencies:
    name: 'Audit Dependencies'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v7'
        with:
          persist-credentials: false
      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v7'
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - name: 'Run Auditor'
        run: 'npm audit'
  code_style:
    name: 'Check Code Style'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v7'
        with:
          persist-credentials: false
      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v7'
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - name: 'Install Dependencies'
        run: 'npm ci'
      - name: 'Run Formatter'
        run: 'npm run format:check'
  lint_code:
    name: 'Lint Code'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v7'
        with:
          persist-credentials: false
      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v7'
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - name: 'Install Dependencies'
        run: 'npm ci'
      - name: 'Run Linter'
        run: 'npm run lint:check'
  automated_tests:
    name: 'Automated Tests'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v7'
        with:
          persist-credentials: false
      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v7'
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'
      - name: 'Install Dependencies'
        run: 'npm ci'
      - name: 'Run Automated Tests'
        run: 'npm run test'
