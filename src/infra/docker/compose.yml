services:
  mailcatcher:
    image: sj26/mailcatcher:v0.10.0
    ports:
      - '1025:1025'
      - '1080:1080'

  postgres:
    environment:
      POSTGRES_DB: fincheck
      POSTGRES_PASSWORD: local_password
      POSTGRES_USER: local_user
    image: postgres:18
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
